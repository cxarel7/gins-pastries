<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gin's Pastries</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="design.css">
</head>
<body>

  <div class="auth">
    <section class="album" id="album" role="region" aria-roledescription="carousel" aria-label="Gin's Pastries photo album">
  <div class="album-stage"></div>
  <button type="button" class="album-arrow album-prev" aria-label="Previous picture">‹</button>
  <button type="button" class="album-arrow album-next" aria-label="Next picture">›</button>
  <div class="album-bar">
    <div class="album-dots"></div>
    <button type="button" class="album-toggle" aria-label="Pause slideshow">❚❚</button>
  </div>
</section>

    <main class="auth-side">

      <!-- ===== LOGIN ===== -->
      <form id="loginForm" class="auth-card" novalidate>
        <h1 class="auth-title">Login</h1>
        <p class="auth-sub">Welcome to Gin's Pastries</p>

        <label class="auth-label" for="email">Email</label>
        <input class="auth-input" type="email" id="email" autocomplete="email">

        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" type="password" id="password" autocomplete="current-password">

        <div class="row-between">
          <label class="show-password"><input type="checkbox" id="showPassword"> Show Password</label>
          <a href="#" id="forgotLink" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-main" id="loginBtn">Login</button>
        <div id="message" role="alert" aria-live="polite"></div>
        <p class="auth-link">Don't have an account? <a href="#" id="showRegister">Register</a></p>
      </form>

      <!-- ===== CREATE ACCOUNT ===== -->
      <form id="registerForm" class="auth-card hidden" novalidate>
        <h1 class="auth-title">Create Account</h1>

        <div class="auth-row">
          <div>
            <label class="auth-label" for="firstName">First Name</label>
            <input class="auth-input" type="text" id="firstName" autocomplete="given-name">
          </div>
          <div>
            <label class="auth-label" for="lastName">Last Name</label>
            <input class="auth-input" type="text" id="lastName" autocomplete="family-name">
          </div>
        </div>

        <label class="auth-label" for="contact">Contact</label>
        <input class="auth-input" type="tel" id="contact" placeholder="09XX XXX XXXX" autocomplete="tel">

        <label class="auth-label" for="facebook">Facebook link (optional)</label>
        <input class="auth-input" type="text" id="facebook" placeholder="facebook.com/yourname">

        <label class="auth-label" for="regEmail">Email</label>
        <input class="auth-input" type="email" id="regEmail" autocomplete="email">

        <label class="auth-label small" for="regCode">Code</label>
        <div class="code-row">
          <input class="auth-input" type="text" id="regCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 digits">
          <button type="button" class="btn-outline" id="sendRegCode">SEND CODE</button>
        </div>

        <label class="auth-label" for="regPassword">Password</label>
        <input class="auth-input" type="password" id="regPassword" autocomplete="new-password">
        <label class="show-password"><input type="checkbox" id="showRegPassword"> Show Password</label>

        <button type="submit" class="btn-main" id="registerBtn">Register</button>
        <div id="registerMessage" role="alert" aria-live="polite"></div>
        <button type="button" class="btn-back" id="backBtn">Back to login</button>
      </form>

      <!-- ===== FORGET PASSWORD ===== -->
      <form id="forgotForm" class="auth-card hidden" novalidate>
        <h1 class="auth-title">Forget Password</h1>

        <label class="auth-label" for="fpEmail">Email</label>
        <input class="auth-input" type="email" id="fpEmail" autocomplete="email">

        <label class="auth-label small" for="fpCode">Code</label>
        <div class="code-row">
          <input class="auth-input" type="text" id="fpCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 digits">
          <button type="button" class="btn-outline" id="sendFpCode">SEND CODE</button>
        </div>

        <label class="auth-label" for="fpPassword">Password</label>
        <input class="auth-input" type="password" id="fpPassword" autocomplete="new-password" placeholder="New password">
        <label class="show-password"><input type="checkbox" id="showFpPassword"> Show Password</label>

        <button type="submit" class="btn-main" id="fpBtn">Change</button>
        <div id="fpMessage" role="alert" aria-live="polite"></div>
        <button type="button" class="btn-back" id="fpBack">Back to login</button>
      </form>

    </main>
  </div>

   <footer id="siteFooter" data-compact></footer>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="album.js"></script>
<script src="Script.js"></script>
<script src="footer.js"></script>
</body>
</html>
