<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Gin's Pastries</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="C-Page.css">
</head>
<body>

    <header class="PageHeader sh" id="siteHeader"></header>

    <main class="ct-main">
        <h1 class="ct-title">CART</h1>

        <div class="ct-layout">
            <section class="ct-table" aria-label="Cart items">
                <div class="ct-head">
                    <span>NO.</span><span>PRODUCT</span><span>UNIT PRICE</span>
                    <span>QUANTITY</span><span>TOTAL</span><span>ACTION</span>
                </div>
                <div class="ct-body" id="cartItems"></div>
            </section>

            <aside class="ct-pickup">
                <div class="ct-pickup-in">
                    <h2>PICKUP TIME</h2>
                    <div class="ct-when">
                        <label for="pickupDate">Date</label>
                        <input type="date" id="pickupDate">
                        <label for="pickupTime">Time</label>
                        <input type="time" id="pickupTime">
                    </div>
                    <div class="ct-total">TOTAL:<div id="cartTotal">₱0</div></div>
                    <button type="button" class="ct-checkout" id="checkoutBtn">CHECKOUT</button>
                    <div class="ct-msg" id="cartMessage" role="alert" aria-live="polite"></div>
                </div>
            </aside>
        </div>
    </main>

    <footer id="siteFooter"></footer>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="toast.js"></script>
<script src="cartstore.js"></script>
<script src="header.js"></script>
<script src="customer.js"></script>
<script src="notify.js"></script>
<script src="profile.js"></script>
<script src="cart.js"></script>
<script src="footer.js"></script>
</body>
</html>
